name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/site-readability-github-pages-69073p]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site
        run: |
          mkdir _site
          cp -r index.html styles.css app.js assets .nojekyll _site/
          # Versionar CSS/JS con el commit para que el navegador no mezcle archivos viejos y nuevos.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
